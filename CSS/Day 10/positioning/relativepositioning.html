<!-- Relative Positioning : The element is positioned relative to its normal position -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Link CSS Example</title>
  
</head>
<style>
    div {
            border: 1px solid black;
            padding: 10px;
            margin: 10px;
        }
.relative {
            position: relative;
            top: 20px;
            left: 30px;
        }
</style>
<body>
    
  <div>Box 1</div>
  <div class="relative">Box 2</div>
  
</body>
</html>

<!--Box 2 is shifted 20px down and 30px to the right from its normal position.-->
