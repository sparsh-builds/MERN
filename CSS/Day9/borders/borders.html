<html>
<head>
    <style>
        .simple-border {
            border: 2px solid black;
            padding: 20px;
            text-align: center;
        }
        p.dotted {
            border-style: dotted;
        }
        p.dashed {
            border-style: dashed;
        }
        p.solid {
            border-style: solid;
        }
        p.double {
            border-style: double;
        }
    </style>
</head>
<body>
    <div class="simple-border">This div has a simple black border.</div>
    <p class="dotted">A dotted border.</p>
    <p class="dashed">A dashed border.</p>
    
    <p class="double">A double border.</p>
</body>
</html>
