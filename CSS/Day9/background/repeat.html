<!--The background-repeat property in CSS specifies how the background image 
is repeated. By default, the image repeats both horizontally and vertically. 
You can control the repetition by specifying values such as repeat-x, repeat-y, or no-repeat.-->

<html>
<head>
    <style>
        body {
            background-image:
                url(
            "https://media.geeksforgeeks.org/wp-content/cdn-uploads/20190417124305/250.png");
            background-repeat: repeat-x;
        }
    </style>
</head>
<body>
    <h1>"Hello world"</h1>
</body>
</html>
