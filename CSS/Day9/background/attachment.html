<!--
    Background-attachment Property
    The background-attachment property in CSS specifies how the background 
    image behaves when the user scrolls the page.
By setting the value to fixed, the background image stays in place while the content of the page scrolls.-->


<html>
<head>
    <style>
        body {
            background-image:
                url(
            "https://media.geeksforgeeks.org/wp-content/cdn-uploads/20190417124305/250.png");
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Geeksforgeeks</h1>
</body>
</html>

<!--background-attachment: fixed: The background image is fixed in place, meaning it will not scroll with the page's content.
As you scroll, the background image remains static, providing a parallax effect.

-->
