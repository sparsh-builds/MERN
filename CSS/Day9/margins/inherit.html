<html>
<head>
    <style>
        .parent {
            margin: 20px;
        }
        .child {
            margin: inherit;
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <div class="parent">
        Parent Element
        <div class="child"> Child inherits margin from parent. </div>
    </div>
</body>
</html>
