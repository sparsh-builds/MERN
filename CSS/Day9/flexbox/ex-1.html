<!DOCTYPE html>


<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
    .flex-container {
        display: flex;  /*Tells the browser: "Turn on Flexbox mode. Put all children (Item1, Item2, Item3) in a horizontal row by default."*/
        flex-wrap: wrap;  /*"If the screen gets too narrow and items run out of room, let them automatically drop down to a new row instead of breaking out of the box."*/
        justify-content: space-around; /*"Distribute extra empty space evenly around each item so they aren't clumped together."*/
        background-color: #32a852;
    }
    .flex-container div {
        background-color: #c9d1cb;
        margin: 10px;
        padding: 20px;
        flex: 1 1 200px;  /*"Start each item at a ideal width of 200px. If there's extra room, let them grow equally (1) to fill it; if space is tight, let them shrink (1)."*/
    }
    @media (max-width: 600px) { /*A Media Query acts like an IF statement for your styling:

"IF the screen width is 600 pixels or smaller, change the layout."

On Desktop screens (> 600px): Item1, Item2, and Item3 sit side-by-side in a row.

On Mobile screens (≤ 600px): The media query activates and changes flex-direction to column. Now, the items stack on top of each other vertically so they fit comfortably on a phone screen.*/

        .flex-container {
            flex-direction: column;
        }
    }

    @media (prefers-color-scheme: dark) {
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .flex-container {
            background-color: #1e1e1e;
        }
        .flex-container div {
            background-color: #2c2c2c;
        }
    }
    </style>
</head>
<body>
    <h2>Responsive Flexbox</h2>
    <div class="flex-container">
        <div>Item1</div>
        <div>Item2</div>
        <div>Item3</div>
    </div>
</body>
</html>

<!--The .flex-container is a flexbox container with flex-wrap: wrap to allow items to wrap and justify-content: space-around for equal spacing between items.
Media queries ensure a responsive layout by changing the flex-direction to column for screens smaller than 600px.-->
