<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width,
                   initial-scale=1.0">
    <title>Complex Layout with Flexbox</title>
    <style>
        /* Complex Layout with Flexbox */
        .complex-container {
            display: flex;  /*Activates Flexbox on the parent container. By default, it places its immediate children (.sidebar and .content) side-by-side in a horizontal row.*/

            flex-wrap: wrap; /*flex-wrap: wrap;: Allows the items to break onto a new line (wrap) when the viewport or container gets too narrow to fit them side-by-side.*/


        }

        .sidebar {
            background-color: #333;
            color: white;
            padding: 20px;
            flex: 1 1 200px;  /* 1 share of free space */
            /* Sidebar width */
        }

        .content {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            flex: 2 1 400px;  /* size is 400 if more then expand to double if small then shrink as your size 
            /* Content area width */
        }
    </style>
</head>

<body>

    <!-- Complex Layout with Sidebar and Content -->
    <div class="complex-container">
        <div class="sidebar">Sidebar</div>
        <div class="content">Main Content Area</div>
    </div>

</body>

</html>

<!--$$\text{flex: } \underbrace{\text{flex-grow}}_{\text{1st value}} \quad \underbrace{\text{flex-shrink}}_{\text{2nd value}} \quad \underbrace{\text{flex-basis}}_{\text{3rd value}};$$-->

<!--Together, the combined minimum ideal width is $200\text{px} + 400\text{px} = 600\text{px}$.On wide screens (Container width $\ge 600\text{px}$):Both items sit side-by-side on the same line.Any leftover space is split 1 : 2 (Sidebar gets $\frac{1}{3}$, Main Content gets $\frac{2}{3}$).On mobile / narrow screens (Container width $< 600\text{px}$):Because flex-wrap: wrap is active, the container cannot fit both base widths on a single line.The .content box drops below the .sidebar, stacking vertically.Because both have flex-grow > 0, each item stretches to take the full 100% width of its respective row.-->
