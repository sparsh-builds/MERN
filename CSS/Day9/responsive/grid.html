<!--Flexbox can be used to create simple grid layouts where items are arranged in rows and columns.
 Flexbox ensures that columns in a grid layout have equal height, even if their content varies. 
 Flexbox grids automatically adjust based on screen size. To center grid items within their container, 
 Flexbox properties like justify-content and align-items can be used. While Flexbox is useful for simple grids 
 and layouts, CSS Grid is more suitable for complex grid structures.-->

 <!DOCTYPE html>
 <html lang="en">
 
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" 
           content="width=device-width, 
                    initial-scale=1.0">
     <title>Grid Layouts with Flexbox</title>
     <style>
         /* Grid Layouts with Flexbox */
         .grid-container {
             display: flex;
             flex-wrap: wrap;
             /* Wrap items to next line if screen size decreases*/
             padding: 20px;
         }
 
         .grid-item {
             background-color: #4CAF50;
             color: white;
             padding: 20px;
             margin: 10px;
             flex: 1 1 calc(33.333% - 20px);
             /* 3 items per row with spacing
             
             To fit 3 items in a single row, each item needs to take up 1/3 of the container width ($100\% \div 3 = 33.333\%$).
             However, if your items have margins—for example, margin: 10px on all sides—each item adds 20px of extra horizontal
            space (10px left + 10px right).
             
             */
             box-sizing: border-box;
         }
     </style>
 </head>
 
 <body>
 
     <!-- Flexbox Grid Layout -->
     <div class="grid-container">
         <div class="grid-item">Item 1</div>
         <div class="grid-item">Item 2</div>
         <div class="grid-item">Item 3</div>
         <div class="grid-item">Item 4</div>
         <div class="grid-item">Item 5</div>
         <div class="grid-item">Item 6</div>
     </div>
 
 </body>
 
 </html>
